services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guillermo_tays
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guillermo_tays"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
